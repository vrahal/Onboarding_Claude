<title>Onboarding Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400;1,700&display=swap">

<style>
  /* ---------- tokens ---------- */
  :root {
    --bg: #F3F7F8;
    --surface: #FFFFFF;
    --surface-2: #E6F1F2;
    --surface-hover: #EEF6F7;
    --border: #D6E4E6;
    --border-strong: #BBD0D3;
    --text: #28353F;
    --text-muted: #5C707A;
    --text-faint: #8C9DA5;
    --accent: #12A0B0;
    --accent-strong: #0C7B88;
    --accent-contrast: #FFFFFF;
    --accent-wash: #DEF3F5;
    --cat-hr: #9B4396;
    --cat-hr-bg: #F2E1F0;
    --cat-it: #0C7B88;
    --cat-it-bg: #DEF3F5;
    --danger: #B0552A;
    --danger-bg: #F5E1D5;
    --shadow: 0 1px 2px rgba(40, 53, 63, 0.07), 0 8px 24px -12px rgba(40, 53, 63, 0.2);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0F1A1E;
      --surface: #16242A;
      --surface-2: #1D2F35;
      --surface-hover: #24383F;
      --border: #2C444C;
      --border-strong: #3B5A63;
      --text: #E7F0F2;
      --text-muted: #9BB0B6;
      --text-faint: #6D8189;
      --accent: #3FC3D1;
      --accent-strong: #6ED4DE;
      --accent-contrast: #06181B;
      --accent-wash: #17343A;
      --cat-hr: #D57ACD;
      --cat-hr-bg: #35233A;
      --cat-it: #3FC3D1;
      --cat-it-bg: #17343A;
      --danger: #E38F63;
      --danger-bg: #3A2419;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px -12px rgba(0, 0, 0, 0.5);
    }
  }

  :root[data-theme="dark"] {
    --bg: #0F1A1E;
    --surface: #16242A;
    --surface-2: #1D2F35;
    --surface-hover: #24383F;
    --border: #2C444C;
    --border-strong: #3B5A63;
    --text: #E7F0F2;
    --text-muted: #9BB0B6;
    --text-faint: #6D8189;
    --accent: #3FC3D1;
    --accent-strong: #6ED4DE;
    --accent-contrast: #06181B;
    --accent-wash: #17343A;
    --cat-hr: #D57ACD;
    --cat-hr-bg: #35233A;
    --cat-it: #3FC3D1;
    --cat-it-bg: #17343A;
    --danger: #E38F63;
    --danger-bg: #3A2419;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px -12px rgba(0, 0, 0, 0.5);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Calibri, Carlito, "Segoe UI", Arial, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3 { font-family: Calibri, Carlito, "Segoe UI", Arial, sans-serif; font-weight: 700; text-wrap: balance; margin: 0; }

  .mono { font-family: Calibri, Carlito, "Segoe UI", Arial, sans-serif; font-variant-numeric: tabular-nums; }

  button { font-family: inherit; cursor: pointer; }

  a { color: inherit; }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 4px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 0.001ms !important; animation-duration: 0.001ms !important; }
  }

  /* ---------- layout ---------- */
  .app {
    display: grid;
    grid-template-columns: 300px 1fr;
    min-height: 100vh;
  }

  @media (max-width: 780px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { border-right: none; border-bottom: 1px solid var(--border); }
  }

  .sidebar {
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 28px 20px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .brand {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    padding: 0 4px;
  }

  .brand h1 { font-size: 21px; font-weight: 700; letter-spacing: -0.01em; }

  .brand p {
    margin: 0;
    font-size: 12.5px;
    color: var(--text-muted);
    letter-spacing: 0.02em;
  }

  .theme-toggle-btn {
    flex: none;
    margin-top: 1px;
  }

  .theme-toggle-btn .icon-sun { display: none; }
  .theme-toggle-btn.is-dark .icon-sun { display: block; }
  .theme-toggle-btn.is-dark .icon-moon { display: none; }

  .hire-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    overflow-y: auto;
  }

  .hire-card {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 10px;
    border-radius: 10px;
    border: 1px solid transparent;
    background: transparent;
    text-align: left;
    width: 100%;
    color: var(--text);
    position: relative;
  }

  .hire-card:hover { background: var(--surface-hover); }

  .hire-card.active {
    background: var(--accent-wash);
    border-color: var(--border-strong);
  }

  .avatar {
    flex: none;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--surface-2);
    color: var(--text-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  .hire-card.active .avatar { background: var(--accent); color: var(--accent-contrast); }

  .hire-meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }

  .hire-meta .name {
    font-size: 13.5px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .hire-meta .sub {
    font-size: 11.5px;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .ring {
    flex: none;
    width: 30px;
    height: 30px;
  }

  .ring circle.track { stroke: var(--surface-2); }
  .ring circle.fill { stroke: var(--accent); transition: stroke-dashoffset 0.3s ease; }
  .ring text { font-family: Calibri, Carlito, "Segoe UI", Arial, sans-serif; font-size: 8.5px; fill: var(--text-muted); }

  .add-hire-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px dashed var(--border-strong);
    background: transparent;
    color: var(--text-muted);
    font-size: 13px;
    font-weight: 600;
  }

  .add-hire-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-wash); }

  .sidebar-footer {
    margin-top: auto;
    font-size: 11px;
    color: var(--text-faint);
    padding: 0 4px;
  }

  /* ---------- main ---------- */
  .main {
    padding: 40px 48px 80px;
    max-width: 760px;
  }

  @media (max-width: 780px) {
    .main { padding: 28px 20px 60px; }
  }

  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 14px;
    padding-top: 60px;
    max-width: 420px;
  }

  .empty-state h2 { font-size: 24px; font-weight: 500; }
  .empty-state p { color: var(--text-muted); margin: 0; font-size: 14px; }

  .primary-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    border-radius: 999px;
    border: none;
    background: var(--accent);
    color: var(--accent-contrast);
    font-size: 13.5px;
    font-weight: 600;
    box-shadow: var(--shadow);
  }

  .primary-btn:hover { background: var(--accent-strong); }

  .hire-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 20px;
    margin-bottom: 8px;
  }

  .hire-header h2 { font-size: 30px; font-weight: 600; }

  .hire-header .role-line {
    margin: 4px 0 0;
    color: var(--text-muted);
    font-size: 14.5px;
  }

  .header-actions { display: flex; gap: 8px; flex: none; }

  .icon-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
  }

  .icon-btn:hover { color: var(--danger); border-color: var(--danger); background: var(--danger-bg); }

  .icon-btn.confirming, .icon-btn.confirming:hover {
    color: var(--accent-contrast);
    border-color: var(--danger);
    background: var(--danger);
  }

  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    margin-top: 14px;
  }

  .status-badge.ok { background: var(--accent-wash); color: var(--accent-strong); }
  .status-badge.warn { background: var(--danger-bg); color: var(--danger); }
  .status-badge.done { background: var(--surface-2); color: var(--text-muted); }

  .progress-block { margin: 22px 0 34px; }

  .progress-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
  }

  .progress-top .pct { font-family: Calibri, Carlito, "Segoe UI", Arial, sans-serif; font-variant-numeric: tabular-nums; font-size: 13px; color: var(--text-muted); }

  .progress-bar {
    height: 8px;
    border-radius: 999px;
    background: var(--surface-2);
    overflow: hidden;
  }

  .progress-bar > div {
    height: 100%;
    background: var(--accent);
    border-radius: 999px;
    transition: width 0.3s ease;
  }

  .stage {
    margin-bottom: 30px;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: var(--surface);
    overflow: hidden;
  }

  .stage-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--surface-2);
  }

  .stage-head h3 { font-size: 15.5px; font-weight: 600; }
  .stage-head .hint { font-size: 12px; color: var(--text-faint); margin-top: 2px; }
  .stage-head .count { font-family: Calibri, Carlito, "Segoe UI", Arial, sans-serif; font-variant-numeric: tabular-nums; font-size: 12px; color: var(--text-muted); flex: none; }

  .task-row {
    display: flex;
    gap: 12px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    align-items: flex-start;
  }

  .task-row:last-of-type { border-bottom: none; }

  .task-row.done .task-title { color: var(--text-faint); text-decoration: line-through; text-decoration-color: var(--border-strong); }

  .task-checkbox {
    flex: none;
    width: 18px;
    height: 18px;
    margin-top: 2px;
    accent-color: var(--accent);
  }

  .task-body { flex: 1; min-width: 0; }

  .task-title-line {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .task-title { font-size: 14px; }

  .chip {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 5px;
    flex: none;
  }

  .chip.cat-hr { background: var(--cat-hr-bg); color: var(--cat-hr); }
  .chip.cat-it { background: var(--cat-it-bg); color: var(--cat-it); }

  .task-note-text {
    margin: 4px 0 0;
    font-size: 12.5px;
    color: var(--text-muted);
    cursor: text;
  }

  .task-note-input {
    margin-top: 6px;
    width: 100%;
    max-width: 420px;
    font-size: 12.5px;
    font-family: inherit;
    padding: 6px 9px;
    border-radius: 7px;
    border: 1px solid var(--border-strong);
    background: var(--bg);
    color: var(--text);
  }

  .task-note-input:focus { border-color: var(--accent); }

  .task-actions {
    flex: none;
    display: flex;
    gap: 4px;
    opacity: 0;
  }

  .task-row:hover .task-actions, .task-row:focus-within .task-actions { opacity: 1; }

  .task-actions button {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    border-radius: 6px;
    border: none;
    background: transparent;
    color: var(--text-faint);
  }

  .task-actions button:hover { background: var(--surface-2); color: var(--text); }
  .task-actions button.note-active { color: var(--accent); }

  .add-task-row {
    display: flex;
    gap: 8px;
    padding: 12px 20px;
    background: var(--surface);
  }

  .add-task-row select {
    flex: none;
    font-size: 12px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text-muted);
    padding: 0 8px;
  }

  .add-task-row input {
    flex: 1;
    min-width: 0;
    font-size: 13px;
    font-family: inherit;
    padding: 7px 10px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
  }

  .add-task-row input:focus, .add-task-row select:focus { border-color: var(--accent); }

  .add-task-row button {
    flex: none;
    border: none;
    background: var(--surface-2);
    color: var(--text-muted);
    border-radius: 7px;
    padding: 0 14px;
    font-size: 12.5px;
    font-weight: 600;
  }

  .add-task-row button:hover { background: var(--accent-wash); color: var(--accent-strong); }

  /* ---------- dialog ---------- */
  dialog {
    border: none;
    border-radius: 16px;
    padding: 0;
    background: var(--surface);
    color: var(--text);
    box-shadow: var(--shadow);
    width: min(420px, 92vw);
  }

  dialog::backdrop { background: rgba(10, 14, 11, 0.45); }

  .dialog-body { padding: 26px 26px 22px; display: flex; flex-direction: column; gap: 16px; }

  .dialog-body h2 { font-size: 19px; font-weight: 600; }

  .field { display: flex; flex-direction: column; gap: 6px; }

  .field label { font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; }

  .field input {
    font-family: inherit;
    font-size: 14px;
    padding: 9px 11px;
    border-radius: 8px;
    border: 1px solid var(--border-strong);
    background: var(--bg);
    color: var(--text);
  }

  .field input:focus { border-color: var(--accent); }

  .dialog-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 4px; }

  .ghost-btn {
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-size: 13.5px;
    font-weight: 600;
    padding: 9px 14px;
    border-radius: 999px;
  }

  .ghost-btn:hover { background: var(--surface-2); }

  svg.icon { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
</style>

<script>
  (function () {
    try {
      var t = localStorage.getItem("onboarding-ledger-theme");
      if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    } catch (e) { /* storage unavailable, fall back to system theme */ }
  })();
</script>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div>
        <h1>Onboarding Ledger</h1>
        <p>New joiner checklists, start to first month</p>
      </div>
      <button class="icon-btn theme-toggle-btn" id="themeToggleBtn" data-action="toggle-theme" title="Switch to dark mode" aria-label="Switch to dark mode">
        <svg class="icon icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        <svg class="icon icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
      </button>
    </div>
    <div class="hire-list" id="hireList"></div>
    <button class="add-hire-btn" data-action="open-add-hire">
      <svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      New joiner
    </button>
    <p class="sidebar-footer">Saved in this browser only.</p>
  </aside>

  <main class="main" id="main"></main>
</div>

<dialog id="hireDialog">
  <form method="dialog" id="hireForm" class="dialog-body">
    <h2>Add a new joiner</h2>
    <div class="field">
      <label for="hireName">Name</label>
      <input id="hireName" name="name" type="text" placeholder="Jamie Tan" required autocomplete="off">
    </div>
    <div class="field">
      <label for="hireRole">Role</label>
      <input id="hireRole" name="role" type="text" placeholder="Product Designer" required autocomplete="off">
    </div>
    <div class="field">
      <label for="hireStart">Start date</label>
      <input id="hireStart" name="start" type="date" required>
    </div>
    <div class="dialog-actions">
      <button type="button" class="ghost-btn" data-action="close-dialog">Cancel</button>
      <button type="submit" class="primary-btn">Add joiner</button>
    </div>
  </form>
</dialog>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "onboarding-ledger-v1";

  var STAGES = [
    { key: "before", label: "Before Day 1", hint: "Wrapped up before their first day" },
    { key: "day1", label: "Day 1", hint: "Handled on their first day" },
    { key: "week1", label: "First Week", hint: "Done within the first five working days" },
    { key: "month1", label: "First Month", hint: "Wrapped up by the 30-day mark" }
  ];

  var CATS = {
    hr: { label: "HR", cls: "cat-hr" },
    it: { label: "IT", cls: "cat-it" }
  };

  var TEMPLATE_TASKS = [
    { id: "b-hr-1", stage: "before", cat: "hr", title: "Send signed offer letter and employment contract" },
    { id: "b-hr-2", stage: "before", cat: "hr", title: "Collect personal details and bank information for payroll" },
    { id: "b-hr-3", stage: "before", cat: "hr", title: "Run background and reference checks" },
    { id: "b-hr-4", stage: "before", cat: "hr", title: "Confirm start date, reporting manager and role details" },
    { id: "b-hr-5", stage: "before", cat: "hr", title: "Send welcome pack with first-day logistics" },
    { id: "b-it-1", stage: "before", cat: "it", title: "Order laptop and peripherals" },
    { id: "b-it-2", stage: "before", cat: "it", title: "Create company email account" },
    { id: "b-it-3", stage: "before", cat: "it", title: "Provision core accounts (HR system, chat, calendar)" },
    { id: "b-it-4", stage: "before", cat: "it", title: "Request building or security access badge" },
    { id: "b-it-5", stage: "before", cat: "it", title: "Set up phone line or extension if needed" },

    { id: "d-hr-1", stage: "day1", cat: "hr", title: "Complete new-hire paperwork and ID verification" },
    { id: "d-hr-2", stage: "day1", cat: "hr", title: "Welcome meeting with manager" },
    { id: "d-hr-3", stage: "day1", cat: "hr", title: "Company and team overview, org chart walkthrough" },
    { id: "d-hr-4", stage: "day1", cat: "hr", title: "Walk through workplace policies and handbook" },
    { id: "d-it-1", stage: "day1", cat: "it", title: "Hand over laptop and equipment" },
    { id: "d-it-2", stage: "day1", cat: "it", title: "Set up account logins, VPN and multi-factor auth" },
    { id: "d-it-3", stage: "day1", cat: "it", title: "Walk through core tools and software" },
    { id: "d-it-4", stage: "day1", cat: "it", title: "Confirm network, printer and shared drive access" },

    { id: "w-hr-1", stage: "week1", cat: "hr", title: "Enroll in benefits (health, pension, leave)" },
    { id: "w-hr-2", stage: "week1", cat: "hr", title: "Schedule recurring 1:1s with manager" },
    { id: "w-hr-3", stage: "week1", cat: "hr", title: "Assign an onboarding buddy or mentor" },
    { id: "w-hr-4", stage: "week1", cat: "hr", title: "Review role expectations and first 30-60-90 goals" },
    { id: "w-it-1", stage: "week1", cat: "it", title: "Security and data-handling training" },
    { id: "w-it-2", stage: "week1", cat: "it", title: "Confirm all software licenses and access are active" },
    { id: "w-it-3", stage: "week1", cat: "it", title: "Enroll device in backup and management tools" },

    { id: "m-hr-1", stage: "month1", cat: "hr", title: "30-day check-in and feedback conversation" },
    { id: "m-hr-2", stage: "month1", cat: "hr", title: "Confirm probation and performance review schedule" },
    { id: "m-hr-3", stage: "month1", cat: "hr", title: "Collect their feedback on the onboarding experience" },
    { id: "m-it-1", stage: "month1", cat: "it", title: "Follow up on outstanding IT tickets" },
    { id: "m-it-2", stage: "month1", cat: "it", title: "Confirm equipment is fully set up and issue-free" }
  ];

  function uid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return "id-" + Date.now() + "-" + Math.random().toString(16).slice(2);
  }

  function defaultState() {
    return { hires: [], selectedId: null, perHire: {} };
  }

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultState();
      var parsed = JSON.parse(raw);
      if (!parsed || typeof parsed !== "object") return defaultState();
      parsed.hires = parsed.hires || [];
      parsed.perHire = parsed.perHire || {};
      return parsed;
    } catch (e) {
      return defaultState();
    }
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) { /* storage unavailable, continue in memory */ }
  }

  var state = load();
  var deleteTimers = {};

  // ---------- theme ----------

  var THEME_KEY = "onboarding-ledger-theme";

  function systemPrefersDark() {
    return !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
  }

  function getStoredTheme() {
    try { return localStorage.getItem(THEME_KEY); } catch (e) { return null; }
  }

  function effectiveTheme() {
    var stored = getStoredTheme();
    if (stored === "light" || stored === "dark") return stored;
    return systemPrefersDark() ? "dark" : "light";
  }

  function applyTheme() {
    var stored = getStoredTheme();
    if (stored === "light" || stored === "dark") {
      document.documentElement.setAttribute("data-theme", stored);
    } else {
      document.documentElement.removeAttribute("data-theme");
    }
    var eff = effectiveTheme();
    var btn = document.getElementById("themeToggleBtn");
    if (btn) {
      btn.classList.toggle("is-dark", eff === "dark");
      var label = eff === "dark" ? "Switch to light mode" : "Switch to dark mode";
      btn.title = label;
      btn.setAttribute("aria-label", label);
    }
  }

  function toggleTheme() {
    var next = effectiveTheme() === "dark" ? "light" : "dark";
    try { localStorage.setItem(THEME_KEY, next); } catch (e) { /* continue without persisting */ }
    applyTheme();
  }

  function hireState(id) {
    if (!state.perHire[id]) {
      state.perHire[id] = { completed: {}, notes: {}, removed: {}, custom: [] };
    }
    return state.perHire[id];
  }

  function tasksForHire(id) {
    var hs = hireState(id);
    var list = TEMPLATE_TASKS.filter(function (t) { return !hs.removed[t.id]; });
    hs.custom.forEach(function (t) { list.push(t); });
    return list;
  }

  function progressFor(id) {
    var list = tasksForHire(id);
    var hs = hireState(id);
    var done = list.filter(function (t) { return hs.completed[t.id]; }).length;
    return { done: done, total: list.length, pct: list.length ? Math.round((done / list.length) * 100) : 0 };
  }

  function initials(name) {
    var parts = name.trim().split(/\s+/).filter(Boolean);
    if (!parts.length) return "?";
    if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
    return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
  }

  function dayOnly(d) {
    return new Date(d.getFullYear(), d.getMonth(), d.getDate());
  }

  function startInfo(startDateStr) {
    var start = dayOnly(new Date(startDateStr + "T00:00:00"));
    var today = dayOnly(new Date());
    var diffDays = Math.round((start - today) / 86400000);
    return { start: start, diffDays: diffDays };
  }

  function formatDate(startDateStr) {
    var d = new Date(startDateStr + "T00:00:00");
    return new Intl.DateTimeFormat(undefined, { weekday: "short", day: "numeric", month: "short", year: "numeric" }).format(d);
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function ringSvg(pct, size) {
    var r = (size - 4) / 2;
    var c = 2 * Math.PI * r;
    var offset = c * (1 - pct / 100);
    return '<svg class="ring" viewBox="0 0 ' + size + ' ' + size + '">' +
      '<circle class="track" cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke-width="3"/>' +
      '<circle class="fill" cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke-width="3" ' +
      'stroke-dasharray="' + c + '" stroke-dashoffset="' + offset + '" stroke-linecap="round" ' +
      'transform="rotate(-90 ' + size / 2 + ' ' + size / 2 + ')"/>' +
      "</svg>";
  }

  function renderSidebar() {
    var el = document.getElementById("hireList");
    if (!state.hires.length) {
      el.innerHTML = '<p style="font-size:12.5px;color:var(--text-faint);padding:8px 4px;">No joiners yet. Add your first below.</p>';
      return;
    }
    var sorted = state.hires.slice().sort(function (a, b) { return a.startDate.localeCompare(b.startDate); });
    el.innerHTML = sorted.map(function (h) {
      var p = progressFor(h.id);
      var active = h.id === state.selectedId;
      return '<button class="hire-card' + (active ? " active" : "") + '" data-action="select-hire" data-id="' + h.id + '">' +
        '<span class="avatar">' + initials(h.name) + "</span>" +
        '<span class="hire-meta"><span class="name">' + escapeHtml(h.name) + '</span>' +
        '<span class="sub">' + escapeHtml(h.role) + " &middot; " + p.done + "/" + p.total + "</span></span>" +
        ringSvg(p.pct, 30) +
        "</button>";
    }).join("");
  }

  function renderMain() {
    var el = document.getElementById("main");
    var hire = state.hires.find(function (h) { return h.id === state.selectedId; });

    if (!hire) {
      el.innerHTML =
        '<div class="empty-state">' +
        "<h2>No joiner selected</h2>" +
        "<p>Add a new joiner or pick one from the list to see their onboarding checklist, grouped from before day one through their first month.</p>" +
        '<button class="primary-btn" data-action="open-add-hire">' +
        '<svg class="icon" viewBox="0 0 24 24" stroke="currentColor"><path d="M12 5v14M5 12h14"/></svg>' +
        "Add a new joiner</button>" +
        "</div>";
      return;
    }

    var hs = hireState(hire.id);
    var prog = progressFor(hire.id);
    var info = startInfo(hire.startDate);

    var earlyTasks = tasksForHire(hire.id).filter(function (t) { return t.stage === "before" || t.stage === "day1"; });
    var earlyOutstanding = earlyTasks.filter(function (t) { return !hs.completed[t.id]; }).length;

    var badge;
    if (prog.total > 0 && prog.done === prog.total) {
      badge = '<span class="status-badge done">Fully onboarded</span>';
    } else if (info.diffDays > 0) {
      badge = '<span class="status-badge ok">Starts in ' + info.diffDays + (info.diffDays === 1 ? " day" : " days") + "</span>";
    } else if (info.diffDays === 0) {
      badge = '<span class="status-badge ok">Starts today</span>';
    } else if (earlyOutstanding > 0) {
      badge = '<span class="status-badge warn">' + earlyOutstanding + " pre-start/day-1 " + (earlyOutstanding === 1 ? "task" : "tasks") + " outstanding</span>";
    } else {
      badge = '<span class="status-badge ok">On track</span>';
    }

    var html = '<div class="hire-header"><div>' +
      "<h2>" + escapeHtml(hire.name) + "</h2>" +
      '<p class="role-line">' + escapeHtml(hire.role) + " &middot; starts " + formatDate(hire.startDate) + "</p>" +
      badge +
      "</div>" +
      '<div class="header-actions"><button class="icon-btn" data-action="delete-hire" data-id="' + hire.id + '" title="Remove joiner" aria-label="Remove joiner">' +
      '<svg class="icon" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3m-8 0 1 13h8l1-13"/></svg>' +
      "</button></div></div>";

    html += '<div class="progress-block"><div class="progress-top"><span>Overall progress</span>' +
      '<span class="pct">' + prog.done + " / " + prog.total + " &middot; " + prog.pct + "%</span></div>" +
      '<div class="progress-bar"><div style="width:' + prog.pct + '%"></div></div></div>';

    STAGES.forEach(function (stage) {
      var tasks = tasksForHire(hire.id).filter(function (t) { return t.stage === stage.key; });
      var doneCount = tasks.filter(function (t) { return hs.completed[t.id]; }).length;

      html += '<section class="stage"><div class="stage-head"><div><h3>' + stage.label + "</h3>" +
        '<div class="hint">' + stage.hint + "</div></div>" +
        '<span class="count">' + doneCount + " / " + tasks.length + "</span></div>";

      tasks.forEach(function (t) {
        var isDone = !!hs.completed[t.id];
        var note = hs.notes[t.id] || "";
        var cat = CATS[t.cat];
        html += '<div class="task-row' + (isDone ? " done" : "") + '" data-task-row="' + t.id + '">' +
          '<input type="checkbox" class="task-checkbox" data-action="toggle-task" data-hire="' + hire.id + '" data-task="' + t.id + '"' + (isDone ? " checked" : "") + ' aria-label="Mark done">' +
          '<div class="task-body">' +
          '<div class="task-title-line"><span class="task-title">' + escapeHtml(t.title) + '</span>' +
          '<span class="chip ' + cat.cls + '">' + cat.label + "</span></div>";

        if (note) {
          html += '<p class="task-note-text" data-action="edit-note" data-task="' + t.id + '">' + escapeHtml(note) + "</p>";
        } else {
          html += '<input type="text" class="task-note-input" style="display:none" data-note-input="' + t.id + '" placeholder="Add a note or next action">';
        }
        if (note) {
          html += '<input type="text" class="task-note-input" style="display:none" data-note-input="' + t.id + '" value="' + escapeHtml(note) + '">';
        }

        html += "</div>" +
          '<div class="task-actions">' +
          '<button data-action="toggle-note" data-task="' + t.id + '" class="' + (note ? "note-active" : "") + '" title="Note" aria-label="Add or edit note">' +
          '<svg class="icon" viewBox="0 0 24 24"><path d="m16.5 3.5 4 4L7 21l-4.5 1L4 17.5 16.5 3.5Z"/></svg>' +
          "</button>" +
          '<button data-action="remove-task" data-hire="' + hire.id + '" data-task="' + t.id + '" data-custom="' + (t.custom ? "1" : "0") + '" title="Remove from this checklist" aria-label="Remove task">' +
          '<svg class="icon" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>' +
          "</button>" +
          "</div></div>";
      });

      html += '<div class="add-task-row">' +
        '<select data-add-cat="' + stage.key + '"><option value="hr">HR</option><option value="it">IT</option></select>' +
        '<input type="text" placeholder="Add a task to this stage" data-add-title="' + stage.key + '">' +
        '<button data-action="add-task" data-hire="' + hire.id + '" data-stage="' + stage.key + '">Add</button>' +
        "</div></section>";
    });

    el.innerHTML = html;
  }

  function render() {
    renderSidebar();
    renderMain();
  }

  // ---------- events ----------

  document.addEventListener("click", function (e) {
    var actionEl = e.target.closest("[data-action]");
    if (!actionEl) return;
    var action = actionEl.getAttribute("data-action");

    if (action === "toggle-theme") {
      toggleTheme();
    } else if (action === "select-hire") {
      state.selectedId = actionEl.getAttribute("data-id");
      save();
      render();
    } else if (action === "open-add-hire") {
      document.getElementById("hireForm").reset();
      var today = new Date();
      document.getElementById("hireStart").value = today.toISOString().slice(0, 10);
      document.getElementById("hireDialog").showModal();
      document.getElementById("hireName").focus();
    } else if (action === "close-dialog") {
      document.getElementById("hireDialog").close();
    } else if (action === "delete-hire") {
      var id = actionEl.getAttribute("data-id");
      if (actionEl.dataset.confirming === "1") {
        clearTimeout(deleteTimers[id]);
        delete deleteTimers[id];
        state.hires = state.hires.filter(function (h) { return h.id !== id; });
        delete state.perHire[id];
        if (state.selectedId === id) {
          state.selectedId = state.hires.length ? state.hires[0].id : null;
        }
        save();
        render();
      } else {
        actionEl.dataset.confirming = "1";
        actionEl.classList.add("confirming");
        actionEl.setAttribute("title", "Click again to remove permanently");
        actionEl.setAttribute("aria-label", "Click again to confirm removing this joiner");
        deleteTimers[id] = setTimeout(function () {
          actionEl.dataset.confirming = "0";
          actionEl.classList.remove("confirming");
          actionEl.setAttribute("title", "Remove joiner");
          actionEl.setAttribute("aria-label", "Remove joiner");
        }, 3000);
      }
    } else if (action === "remove-task") {
      var hid = actionEl.getAttribute("data-hire");
      var tid = actionEl.getAttribute("data-task");
      var hs = hireState(hid);
      if (hs.custom.some(function (t) { return t.id === tid; })) {
        hs.custom = hs.custom.filter(function (t) { return t.id !== tid; });
      } else {
        hs.removed[tid] = true;
      }
      save();
      render();
    } else if (action === "toggle-note") {
      var row = actionEl.closest(".task-row");
      var input = row.querySelector("[data-note-input]");
      var textEl = row.querySelector(".task-note-text");
      if (input.style.display === "none") {
        input.style.display = "block";
        if (textEl) textEl.style.display = "none";
        input.focus();
      } else {
        input.style.display = "none";
        if (textEl) textEl.style.display = "block";
      }
    } else if (action === "edit-note") {
      var row2 = actionEl.closest(".task-row");
      var input2 = row2.querySelector("[data-note-input]");
      actionEl.style.display = "none";
      input2.style.display = "block";
      input2.focus();
    } else if (action === "add-task") {
      var hireId = actionEl.getAttribute("data-hire");
      var stageKey = actionEl.getAttribute("data-stage");
      var row3 = actionEl.closest(".add-task-row");
      var titleInput = row3.querySelector("[data-add-title]");
      var catSelect = row3.querySelector("[data-add-cat]");
      var title = titleInput.value.trim();
      if (!title) { titleInput.focus(); return; }
      var hs2 = hireState(hireId);
      hs2.custom.push({ id: uid(), stage: stageKey, cat: catSelect.value, title: title, custom: true });
      save();
      render();
    }
  });

  document.addEventListener("change", function (e) {
    if (e.target.matches(".task-checkbox")) {
      var hid = e.target.getAttribute("data-hire");
      var tid = e.target.getAttribute("data-task");
      var hs = hireState(hid);
      if (e.target.checked) hs.completed[tid] = true; else delete hs.completed[tid];
      save();
      render();
    }
  });

  document.addEventListener("focusout", function (e) {
    if (e.target.matches("[data-note-input]")) {
      var tid = e.target.getAttribute("data-note-input");
      var row = e.target.closest(".task-row");
      var hireIdAttr = row.querySelector(".task-checkbox").getAttribute("data-hire");
      var hs = hireState(hireIdAttr);
      var val = e.target.value.trim();
      if (val) hs.notes[tid] = val; else delete hs.notes[tid];
      save();
      render();
    }
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && e.target.matches("[data-add-title]")) {
      e.preventDefault();
      var row = e.target.closest(".add-task-row");
      row.querySelector('[data-action="add-task"]').click();
    }
  });

  document.getElementById("hireForm").addEventListener("submit", function (e) {
    var name = document.getElementById("hireName").value.trim();
    var role = document.getElementById("hireRole").value.trim();
    var startDate = document.getElementById("hireStart").value;
    if (!name || !role || !startDate) { e.preventDefault(); return; }
    var id = uid();
    state.hires.push({ id: id, name: name, role: role, startDate: startDate, createdAt: Date.now() });
    hireState(id);
    state.selectedId = id;
    save();
    setTimeout(render, 0);
  });

  if (!state.selectedId && state.hires.length) {
    state.selectedId = state.hires[0].id;
  }

  applyTheme();
  render();
})();
</script>
